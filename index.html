<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dce6d8">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>スナフキンBot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <h1>スナフキンBot</h1>
        <p>川辺にいる、ちょっと話しづらい旅人。</p>
      </div>
      <span class="badge">fan-made</span>
      <div class="camp" aria-hidden="true">
        <span class="fire">🔥</span>
        <span class="traveler">🧢</span>
      </div>
    </header>

    <section class="chat" aria-live="polite">
      <div class="status"><span></span><b>ローカルAI版は停止しました</b></div>
      <section class="ai-card">
        <div class="ai-card-head">
          <div>
            <strong>小型モデル実験を終了</strong>
            <small>このページからAIモデルをダウンロードすることはありません。</small>
          </div>
        </div>
        <p>会話品質と端末負荷のバランスが十分でなかったため、約300MBのローカルAI方式はいったん廃止しました。次の方式を検討中です。</p>
      </section>
      <div class="message bot">……ちょっと荷物を減らすことにしたよ。</div>
    </section>

    <form class="composer">
      <input type="text" placeholder="次の方式を準備中です" aria-label="メッセージ" disabled>
      <button type="button" aria-label="送信" disabled>↑</button>
    </form>

    <footer>非公式のファンメイド作品です。原作の台詞は使用していません。</footer>
  </main>
</body>
</html>
