<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dce6d8">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>スナフキンBot</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="character-motion.css">
  <link rel="stylesheet" href="scene-static.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <h1>スナフキンBot</h1>
        <p>川辺にいる、ちょっと話しづらい旅人。</p>
      </div>
      <span class="badge">fan-made / private</span>
    </header>

    <section id="travelerStage" class="traveler-stage" data-state="idle" data-time="day" aria-label="川辺のキャンプにいる旅人">
      <img class="scene-layer scene-bg" src="assets/scene/bg_riverside.webp" alt="森と山に囲まれた静かな川辺" width="1536" height="1024" fetchpriority="high">
      <img class="scene-layer scene-ground" src="assets/scene/ground_camp.webp" alt="" width="1024" height="384" decoding="async">
      <img class="scene-layer scene-log" src="assets/scene/fallen_log.webp" alt="" width="768" height="320" decoding="async">
      <img class="scene-layer scene-rocks" src="assets/scene/rocks.webp" alt="" width="768" height="256" decoding="async">
      <img class="scene-layer scene-tent" src="assets/scene/tent.webp" alt="" width="768" height="768" decoding="async">
      <img class="scene-layer scene-stump" src="assets/scene/stump.webp" alt="" width="384" height="384" decoding="async">
      <img class="scene-layer scene-grass" src="assets/scene/grass.webp" alt="" width="384" height="384" decoding="async">

      <div class="fire-cluster" aria-hidden="true">
        <img class="fire-shadow-layer" src="assets/fire/fire_shadow.webp" alt="" width="256" height="128" decoding="async">
        <img class="fire-glow-layer" src="assets/fire/fire_glow.webp" alt="" width="256" height="128" decoding="async">
        <img class="fire-smoke-layer" src="assets/fire/fire_smoke.webp" alt="" width="256" height="256" decoding="async">
        <img class="fire-body-layer" src="assets/fire/fire_02.webp" alt="" width="256" height="256" decoding="async">
        <img class="fire-embers-layer" src="assets/fire/fire_embers.webp" alt="" width="256" height="256" decoding="async">
      </div>

      <img class="scene-layer scene-character-shadow" src="assets/scene/character_shadow.webp" alt="" width="512" height="256" decoding="async">
      <div id="travelerWrap" class="traveler-wrap">
        <img id="travelerImage" src="assets/characters/character_idle.webp" alt="川辺に立つ旅人" width="768" height="1024" decoding="async">
      </div>
      <img class="scene-layer scene-foreground-tree" src="assets/scene/foreground_tree.webp" alt="" width="512" height="1024" decoding="async">
      <div class="scene-tone" aria-hidden="true"></div>
      <div id="stageCaption" class="stage-caption">静かに川を見ています</div>
    </section>

    <section id="chat" class="chat" aria-live="polite">
      <div class="status"><span class="ready"></span><b id="statusText">川辺にいるようです</b></div>

      <section class="privacy-card">
        <strong>0円・外部AIなし</strong>
        <p>会話本文は外部へ送りません。1日1ランの会話ローグライトとして育てています。</p>
      </section>

      <div id="messages"></div>

      <div id="quickChoices" class="quick-choices">
        <button type="button" data-message="何してる？">何してる？</button>
        <button type="button" data-message="ムーミンは？">ムーミンは？</button>
        <button type="button" data-message="ハーモニカ吹いて">ハーモニカ吹いて</button>
        <button type="button" data-message="またね">今日は帰る</button>
      </div>
    </section>

    <div class="privacy-actions">
      <button id="clearConversation" type="button">この会話を消す</button>
    </div>

    <form id="composer" class="composer">
      <input id="messageInput" type="text" placeholder="話しかける…" autocomplete="off" enterkeyhint="send" aria-label="メッセージ">
      <button type="submit" aria-label="送信">↑</button>
    </form>

    <footer>非公式のファンメイド作品です。原作の台詞は使用していません。</footer>
  </main>
  <script src="dialogue.js"></script>
  <script src="scene-static.js"></script>
  <script src="character-motion.js"></script>
</body>
</html>
