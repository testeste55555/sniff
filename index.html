<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dce6d8">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>スナフキンBot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <h1>スナフキンBot</h1>
        <p>川辺にいる、ちょっと話しづらい旅人。</p>
      </div>
      <span class="badge">fan-made / private</span>
    </header>

    <section id="travelerStage" class="traveler-stage" data-state="idle" aria-label="川辺にいる旅人">
      <div class="river-glow"></div>
      <div class="fire-spot" aria-hidden="true">🔥</div>
      <div id="travelerWrap" class="traveler-wrap">
        <img id="travelerImage" src="assets/snufkin-traveler.webp" alt="緑の帽子とコートを身につけた旅人のCG">
      </div>
      <div id="stageCaption" class="stage-caption">静かに川を見ています</div>
    </section>

    <section id="chat" class="chat" aria-live="polite">
      <div class="status"><span class="ready"></span><b id="statusText">川辺にいるようです</b></div>

      <section class="privacy-card">
        <strong>0円・外部AIなし</strong>
        <p>会話本文は外部へ送りません。1日1ランの会話ローグライトとして育てています。</p>
      </section>

      <div id="messages"></div>

      <div id="quickChoices" class="quick-choices">
        <button type="button" data-message="何してる？">何してる？</button>
        <button type="button" data-message="ムーミンは？">ムーミンは？</button>
        <button type="button" data-message="ハーモニカ吹いて">ハーモニカ吹いて</button>
        <button type="button" data-message="またね">今日は帰る</button>
      </div>
    </section>

    <div class="privacy-actions">
      <button id="clearConversation" type="button">この会話を消す</button>
    </div>

    <form id="composer" class="composer">
      <input id="messageInput" type="text" placeholder="話しかける…" autocomplete="off" enterkeyhint="send" aria-label="メッセージ">
      <button type="submit" aria-label="送信">↑</button>
    </form>

    <footer>非公式のファンメイド作品です。原作の台詞は使用していません。</footer>
  </main>
  <script src="dialogue-v7.js"></script>
  <script src="character-motion.js"></script>
</body>
</html>
